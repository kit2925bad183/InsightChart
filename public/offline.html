<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a78d6" />
    <title>Offline — InsightChart</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { --bg: #eef3fb; --card: #ffffff; --text: #0b1f3a; --muted: #5b6f8c; --accent: #2a78d6; --border: #dde6f3; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b1320; --card: #121c2c; --text: #e6edf7; --muted: #93a4bd; --border: #22324a; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 380px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 18px; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0 0 20px; }
      button { font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>InsightChart needs an internet connection to load student data. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
